<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0ff;
    --surface: #ffffff;
    --ink: #302442;
    --muted: #766987;
    --line: #e2d7f2;
    --accent: #9875c9;
    --accent-ink: #ffffff;
    --pos: #1c7a4d;  --pos-bg: #e3f4ea;
    --neg: #b3362b;  --neg-bg: #fbe7e4;
    --neu: #7a5a12;  --neu-bg: #f8efd6;
    --err: #b3362b;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 "Public Sans", system-ui, sans-serif;
  }
  .wrap {
    max-width: 1040px; margin: 0 auto; padding: 48px 20px 72px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px;
  }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; gap: 28px; padding-top: 28px; } }

  h1, h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: clamp(2rem, 4.5vw, 2.9rem); line-height: 1.05; font-weight: 700; }
  .lede { color: var(--muted); max-width: 40ch; margin: 14px 0 0; }

  form { margin-top: 28px; display: grid; gap: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  label, legend { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; padding: 0; }
  input, textarea {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  textarea { min-height: 150px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, .stars input:focus-visible + span {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  fieldset { border: 0; margin: 0; padding: 0; }
  .stars { display: flex; gap: 6px; }
  .stars label { margin: 0; cursor: pointer; }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars span {
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 600;
  }
  .stars input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  button.go {
    justify-self: start; padding: 13px 22px; font: 600 1rem "Public Sans", sans-serif;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; cursor: pointer;
  }
  button.go[disabled] { opacity: .6; cursor: progress; }
  .error { color: var(--err); font-weight: 500; margin: 0; min-height: 1.4em; }

  /* Result panel */
  .result {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px; align-self: start; min-height: 260px;
  }
  .empty { color: var(--muted); margin: 0; }
  .empty strong { color: var(--ink); display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 1.25rem; margin-bottom: 6px; }

  .verdict { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .verdict h2 { font-size: 2rem; }
  .pill { padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600; }
  .pill.pos { background: var(--pos-bg); color: var(--pos); }
  .pill.neg { background: var(--neg-bg); color: var(--neg); }
  .pill.neu { background: var(--neu-bg); color: var(--neu); }

  h3 { font-size: .95rem; margin: 0 0 8px; }
  ul { margin: 0 0 22px; padding-left: 20px; }
  li { margin-bottom: 4px; }
  .suggestion { margin: 0 0 22px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--bg); }

  .mail { margin: 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: .92rem; }
  .mail.ok { color: var(--pos); }
  .mail.bad { color: var(--err); }

  .spinner { width: 20px; height: 20px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: -4px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<main class="wrap">
  <section>
    <h1>Tell your trainer how the course is going</h1>
    <p class="lede">Your feedback is analysed and sent straight to your trainer.</p>

    <form id="form" novalidate>
      <div class="row">
        <div><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div>
        <div><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div>
        <label for="course">Course or batch</label>
        <input id="course" name="course" placeholder="e.g. Python Full Stack, Batch 12" required>
      </div>
      <fieldset>
        <legend>Overall rating</legend>
        <div class="stars">
          <label><input type="radio" name="rating" value="1"><span>1</span></label>
          <label><input type="radio" name="rating" value="2"><span>2</span></label>
          <label><input type="radio" name="rating" value="3"><span>3</span></label>
          <label><input type="radio" name="rating" value="4"><span>4</span></label>
          <label><input type="radio" name="rating" value="5" checked><span>5</span></label>
        </div>
      </fieldset>
      <div>
        <label for="feedback">Your feedback</label>
        <textarea id="feedback" name="feedback" required placeholder="What worked well? What could be better?"></textarea>
      </div>
      <p class="error" id="error" role="alert"></p>
      <button class="go" id="submit" type="submit">Analyse and send to trainer</button>
    </form>
  </section>

  <section class="result" id="result" aria-live="polite">
    <p class="empty"><strong>Your analysis will appear here</strong>Fill in the form and submit to see the sentiment, key points and suggestion.</p>
  </section>
</main>

<script>
const form = document.getElementById("form");
const resultEl = document.getElementById("result");
const errorEl = document.getElementById("error");
const submitBtn = document.getElementById("submit");

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  children.forEach(c => node.append(c));
  return node;
}

function sentimentClass(s) {
  s = s.toLowerCase();
  if (s.includes("positive")) return "pos";
  if (s.includes("negative")) return "neg";
  return "neu";
}

function render(payload) {
  const { result, email_sent, email_error, trainer } = payload;
  resultEl.replaceChildren(
    el("div", { className: "verdict" }, [
      el("h2", { textContent: result.sentiment }),
      el("span", { className: "pill " + sentimentClass(result.sentiment), textContent: "Sentiment" })
    ]),
    el("h3", { textContent: "Key points" }),
    el("ul", {}, result.key_points.map(p => el("li", { textContent: p }))),
    el("h3", { textContent: "Suggestion" }),
    el("p", { className: "suggestion", textContent: result.suggestion }),
    el("p", {
      className: "mail " + (email_sent ? "ok" : "bad"),
      textContent: email_sent
        ? "Sent to " + trainer + "."
        : "Analysis done, but the email to " + trainer + " was not sent: " + email_error
    })
  );
  resultEl.scrollIntoView({ block: "nearest" });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.textContent = "";
  const data = Object.fromEntries(new FormData(form).entries());

  for (const [k, v] of Object.entries(data)) {
    if (!String(v).trim()) { errorEl.textContent = "Please fill in all the fields."; return; }
  }
  if (!form.email.checkValidity()) { errorEl.textContent = "Enter a valid email address."; return; }

  submitBtn.disabled = true;
  resultEl.replaceChildren(el("p", { className: "empty" }, [
    el("span", { className: "spinner" }), "Analysing your feedback and emailing the trainer…"
  ]));

  try {
    const res = await fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.error || "Something went wrong.");
    render(payload);
  } catch (err) {
    errorEl.textContent = err.message;
    resultEl.replaceChildren(el("p", { className: "empty", textContent: "No analysis yet. Fix the problem above and try again." }));
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
